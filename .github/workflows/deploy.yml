name: Deploy

# Publica a demo só depois que o CI passou na main, e só se o Azure estiver configurado
# (variáveis e segredos do repositório). Sem configuração, o workflow não faz nada.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false # nunca interrompe um deploy no meio

jobs:
  api:
    name: API no App Service
    if: >-
      vars.AZURE_WEBAPP_NAME != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: producao
    permissions:
      contents: read
      id-token: write # login no Azure por OIDC: nenhuma senha do Azure fica guardada no GitHub
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publicar
        run: dotnet publish src/Loja.Api --configuration Release --output publicado
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publicado

  web:
    name: Loja no Static Web Apps
    needs: api # o front novo só entra no ar depois da API correspondente
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build com o endereço da API publicada
        working-directory: web
        run: |
          npm ci
          npx ng build --define "API_URL='${{ vars.API_URL }}'"
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web/dist/web/browser
          skip_app_build: true
          skip_api_build: true
