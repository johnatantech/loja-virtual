name: Deploy

# Publica a demo no Render só depois que o CI passou na main, e só se os deploy hooks
# estiverem configurados nos segredos do repositório. Sem eles, o workflow não faz nada.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false # nunca interrompe um deploy no meio

jobs:
  render:
    name: Publicar no Render
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: producao
    env:
      HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
      HOOK_LOJA: ${{ secrets.RENDER_DEPLOY_HOOK_LOJA }}
    steps:
      - name: Verificar configuração
        id: config
        run: |
          if [ -z "$HOOK_API" ] || [ -z "$HOOK_LOJA" ]; then
            echo "Deploy hooks do Render não configurados: nada a publicar."
            echo "pronto=false" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=true" >> "$GITHUB_OUTPUT"
          fi
      # O hook dispara o deploy do commit mais recente da main no Render.
      - name: Publicar API
        if: steps.config.outputs.pronto == 'true'
        run: curl -fsS -X POST "$HOOK_API" > /dev/null
      - name: Publicar loja
        if: steps.config.outputs.pronto == 'true'
        run: curl -fsS -X POST "$HOOK_LOJA" > /dev/null
