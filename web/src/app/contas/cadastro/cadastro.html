<h1>Criar conta</h1>
<p class="subtitulo">Leva menos de um minuto. Seus dados ficam só nesta loja de demonstração.</p>

<form [formGroup]="form" (ngSubmit)="enviar()" novalidate>
  <label>
    Nome
    <input type="text" formControlName="nome" autocomplete="name" [attr.aria-invalid]="invalido('nome')" />
    @if (invalido('nome')) {
      <span class="erro-campo">{{ errosApi()['nome']?.[0] ?? 'Informe seu nome.' }}</span>
    }
  </label>

  <label>
    E-mail
    <input type="email" formControlName="email" autocomplete="email" [attr.aria-invalid]="invalido('email')" />
    @if (invalido('email')) {
      <span class="erro-campo">{{ errosApi()['email']?.[0] ?? 'Informe um e-mail válido.' }}</span>
    }
  </label>

  <label>
    Senha
    <input type="password" formControlName="senha" autocomplete="new-password" [attr.aria-invalid]="invalido('senha')" />
    @if (invalido('senha')) {
      <span class="erro-campo">{{ errosApi()['senha']?.[0] ?? 'A senha não atende aos requisitos abaixo.' }}</span>
    }
    <span class="dica">Mínimo de 8 caracteres, com letra maiúscula, minúscula e número.</span>
  </label>

  @if (erro(); as mensagem) {
    <p class="alerta" role="alert">{{ mensagem }}</p>
  }

  <button type="submit" class="botao-principal" [disabled]="enviando()">
    {{ enviando() ? 'Criando conta...' : 'Criar conta' }}
  </button>
</form>

<p class="alternativa">
  Já tem conta? <a routerLink="/entrar" [queryParams]="{ retorno: retorno() }">Entrar</a>
</p>
